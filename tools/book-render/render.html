<!doctype html>
<html><head><meta charset="utf-8"><title>Book render</title>
<style>html,body{margin:0;background:#E9E9E6}canvas{display:block;width:800px;height:600px}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Offline render of the hardcover (book.md, 3D mockup). Units: mm. Output: transparent PNG, shadow included.
// Cover texture: cover-wrap.jpg, the print file omslag_34_18.pdf at 10 px/mm (page 560.8 x 383.8 mm).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);
const OUT_W = num('w', 1600), OUT_H = num('h', 1200);
const CAM_X = num('cx', 480), CAM_Y = num('cy', 2150), CAM_Z = num('cz', 560);

// print file, mm: back 43.4-253.4 | hinge | spine 263.6-297.4 | hinge | front 307.4-517.4; height 43.4-340.4; turn-in 18
const PAGE_W = 560.8, PAGE_H = 383.8, FORE_F = 517.4, FORE_B = 43.4, TOP = 43.4, BOT = 340.4;
const H = 297;          // board height
const TB = 1.0;         // board thickness in the shape, bevel adds the rest (about 2.8 mm)
const ZO = 16.2, ZI = ZO - TB;
const BEV = 0.9;
const ZOB = ZO + BEV, ZIB = ZI - BEV, XF = 105 + BEV;   // outer surfaces after the bevel

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const wrapTex = await new THREE.TextureLoader().loadAsync('cover-wrap.jpg');
wrapTex.colorSpace = THREE.SRGBColorSpace; wrapTex.anisotropy = 16;

// page edges: fine, slightly irregular lines
const pc = document.createElement('canvas'); pc.width = 2048; pc.height = 64;
const pg = pc.getContext('2d'); pg.fillStyle = '#f5f2ea'; pg.fillRect(0, 0, 2048, 64);
for (let x = 0; x < 2048;) { const a = 0.05 + rnd() * 0.16; pg.fillStyle = `rgba(90,80,60,${a})`; pg.fillRect(x, 0, 0.8, 64); x += 3.2 + rnd() * 3; }
const pageTex = new THREE.CanvasTexture(pc); pageTex.colorSpace = THREE.SRGBColorSpace; pageTex.anisotropy = 16;

// outer run of the case, front fore edge -> hinge -> rounded spine -> hinge -> back fore edge, in (x, z)
function outerRun(p) {
  const b = (ax, az, bx, bz, x, z) => p.bezierCurveTo(ax, az, bx, bz, x, z);
  p.lineTo(-103, ZO);
  b(-105.8, ZO, -106.6, ZO - 1.7, -108.4, ZO - 1.7);   // soft, wide hinge groove
  b(-110.2, ZO - 1.7, -110.8, ZO - 0.2, -112.2, ZO - 0.1);
  b(-117.4, ZO, -119.8, 8.5, -119.8, 0);                  // rounded spine
  b(-119.8, -8.5, -117.4, -ZO, -112.2, -ZO + 0.1);
  b(-110.8, -ZO + 0.2, -110.2, -ZO + 1.7, -108.4, -ZO + 1.7);
  b(-106.6, -ZO + 1.7, -105.8, -ZO, -103, -ZO);
  p.lineTo(105, -ZO);
}
function caseShape() {
  // Shape space is (x, -z); build in (x, z) and flip at the end
  const p = new THREE.Path(); const r = 0.8;
  p.moveTo(105 - r, ZO); outerRun(p);
  p.quadraticCurveTo(105, -ZO, 105, -ZO + r); p.lineTo(105, -ZI - r); p.quadraticCurveTo(105, -ZI, 105 - r, -ZI);
  p.lineTo(-104, -ZI);
  p.bezierCurveTo(-111, -ZI, -118, -7.5, -118, 0);        // inside of the spine
  p.bezierCurveTo(-118, 7.5, -111, ZI, -104, ZI);
  p.lineTo(105 - r, ZI); p.quadraticCurveTo(105, ZI, 105, ZI + r); p.lineTo(105, ZO - r); p.quadraticCurveTo(105, ZO, 105 - r, ZO);
  return new THREE.Shape(p.getPoints(48).map(v => new THREE.Vector2(v.x, -v.y)));
}
// page block: 3 mm squares, fore edge slightly concave, back rounded to follow the spine
function blockShape() {
  const s = new THREE.Shape(); const Z = ZIB - 0.35;
  s.moveTo(101.6, -Z);
  s.quadraticCurveTo(100.4, 0, 101.6, Z);
  s.lineTo(-104, Z);
  s.bezierCurveTo(-111, Z, -116.2, 7, -116.2, 0);
  s.bezierCurveTo(-116.2, -7, -111, -Z, -104, -Z);
  s.lineTo(101.6, -Z);
  return s;
}
function extrude(shape, depth, bevel, segs) {
  let geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs, curveSegments: 48, steps: 1 });
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
  geo = mergeVertices(geo, 1e-3); geo.computeVertexNormals();
  geo.rotateX(-Math.PI / 2);            // shape y -> world -z, extrusion -> world +y
  geo.translate(0, -depth / 2, 0);
  return geo;
}

// arc length along the outer run, so the print file lies on the case at its real measures
const run = new THREE.Path(); run.moveTo(105, ZO); outerRun(run);
const pts = run.getSpacedPoints(1600); const acc = [0];
for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + pts[i].distanceTo(pts[i - 1]));
const L = acc[acc.length - 1], K = (FORE_F - FORE_B) / L;
function nearest(x, z) {
  let bi = 0, bd = Infinity;
  for (let i = 0; i < pts.length; i++) { const dx = pts[i].x - x, dz = pts[i].y - z, d = dx * dx + dz * dz; if (d < bd) { bd = d; bi = i; } }
  return { s: acc[bi], d: Math.sqrt(bd) };
}

const caseGeo = extrude(caseShape(), H - 2 * BEV, BEV, 7);
{
  const p = caseGeo.attributes.position, n = caseGeo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const X = p.getX(i), Y = p.getY(i), Z = p.getZ(i), ny = n.getY(i);
    const { s, d } = nearest(X, Z);
    let u;
    if (X > -103 && d > BEV + 0.35) {       // board edge and inside: the turn-in continues past the fold
      const thick = ZOB - ZIB;
      if (Z > 0) u = X > 104.2 ? FORE_F + (ZOB - Z) : FORE_F + thick + (XF - X);
      else u = X > 104.2 ? FORE_B - (ZOB + Z) : FORE_B - thick - (XF - X);
    } else u = FORE_F - s * K;
    let v = TOP + (H / 2 - Y);
    if (Math.abs(ny) > 0.7) v = ny > 0 ? TOP - Math.min(d, 20) : BOT + Math.min(d, 20);   // head and tail edges
    uv[2 * i] = THREE.MathUtils.clamp(u, 0, PAGE_W) / PAGE_W;
    uv[2 * i + 1] = 1 - THREE.MathUtils.clamp(v, 0, PAGE_H) / PAGE_H;
  }
  caseGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}
const blockGeo = extrude(blockShape(), H - 6 - 0.6, 0.3, 2);
{
  const p = blockGeo.attributes.position, n = blockGeo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const X = p.getX(i), Y = p.getY(i), Z = p.getZ(i), ny = Math.abs(n.getY(i));
    uv[2 * i] = (Z + ZI) / (2 * ZI);
    uv[2 * i + 1] = ny > 0.6 ? (X + 120) / 240 : (Y + H / 2) / H;
  }
  blockGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(OUT_W, OUT_H, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = num('ex', 1.0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = num('env', 0.24);

// matte laminate grain
const nc = document.createElement('canvas'); nc.width = nc.height = 512;
const ng = nc.getContext('2d'); const nd = ng.createImageData(512, 512);
for (let i = 0; i < nd.data.length; i += 4) { const v = 118 + rnd() * 20; nd.data[i] = nd.data[i + 1] = nd.data[i + 2] = v; nd.data[i + 3] = 255; }
ng.putImageData(nd, 0, 0);
const grain = new THREE.CanvasTexture(nc); grain.wrapS = grain.wrapT = THREE.RepeatWrapping; grain.repeat.set(9, 6);
const coverMat = new THREE.MeshPhysicalMaterial({ map: wrapTex, roughness: 0.55, roughnessMap: grain, bumpMap: grain, bumpScale: 0.25, clearcoat: 0.2, clearcoatRoughness: 0.45 });
// corner turn-ins: where the cover is folded over the board, a diagonal fold runs across the edge
// (fore face: |y| from the corner = depth from the outer face; head/tail face: the same from the fore edge; inside: the mitre)
coverMat.onBeforeCompile = sh => {
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
    .replace('#include <map_fragment>', `#include <map_fragment>
    {
      float dx = max(${XF.toFixed(2)} - vObj.x, 0.0);
      float dy = max(${(H / 2).toFixed(2)} - abs(vObj.y), 0.0);
      float dz = ${ZOB.toFixed(2)} - abs(vObj.z);
      float zone = (1.0 - smoothstep(14.0, 18.0, dx)) * (1.0 - smoothstep(14.0, 18.0, dy)) * smoothstep(0.08, 0.3, dz);
      float m = abs(dx - dy) - dz;
      float fold = 1.0 - smoothstep(0.03, 0.22, abs(m));
      float lip = 1.0 - smoothstep(0.05, 0.4, abs(m - 0.3));
      diffuseColor.rgb *= 1.0 - zone * (0.32 * fold - 0.06 * lip);
    }`);
};
const pageMat = new THREE.MeshStandardMaterial({ map: pageTex, roughness: 0.95 });
const book = new THREE.Group();
const caseMesh = new THREE.Mesh(caseGeo, coverMat), blockMesh = new THREE.Mesh(blockGeo, pageMat);
for (const m of [caseMesh, blockMesh]) { m.castShadow = true; m.receiveShadow = true; book.add(m); }
// lying on the table, front up, head away from the camera
book.rotation.x = -Math.PI / 2;
book.position.y = ZOB + 0.01;
scene.add(book);

// floor: shadow only, so the PNG sits on any pale ground
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: num('so', 0.2) }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// contact shadow under the book, soft
const cc = document.createElement('canvas'); cc.width = cc.height = 256;
const cg = cc.getContext('2d'); const grd = cg.createRadialGradient(128, 128, 0, 128, 128, 128);
grd.addColorStop(0, 'rgba(0,0,0,0.4)'); grd.addColorStop(0.6, 'rgba(0,0,0,0.16)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
cg.fillStyle = grd; cg.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(275, 360), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cc), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.set(-10, 0.05, 2); scene.add(contact);

// key light from the right, soft shadow
const key = new THREE.DirectionalLight(0xffffff, num('ki', 2.3));
key.position.set(num('kx', 600), num('ky', 900), num('kz', -60)); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = num('sr', 34); key.shadow.blurSamples = 48;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.6;
Object.assign(key.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 100, far: 2000 });
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.2); fill.position.set(-600, 300, 500); scene.add(fill);

const camera = new THREE.PerspectiveCamera(num('fov', 11), OUT_W / OUT_H, 10, 5000);
camera.up.set(0, 0, -1); camera.position.set(CAM_X, CAM_Y, CAM_Z); camera.lookAt(-6, 0, 8);
renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
