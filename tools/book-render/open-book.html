<!doctype html>
<html><head><meta charset="utf-8"><title>Open book render</title>
<style>html,body{margin:0;background:#F5F5F5}canvas{display:block;width:1000px;height:auto}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Offline render of an open white hardcover, close up, for the type block on styupan.html (styupan.md). Units: mm.
// Pages are single curved sheets that rise from the gutter and fan out; a ribbon bookmark runs out of the gutter.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);
const OUT_W = num('w', 2000), OUT_H = num('h', 1000);

const W = 150, D = 230, N = num('n', 46);         // page width, page height (along the spine), sheets per side
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(OUT_W, OUT_H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = num('ex', 1.0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, num('f0', 320), num('f1', 800));   // the table fades to white, no horizon
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = num('env', 0.55);

const paper = new THREE.MeshStandardMaterial({ color: 0xfbfaf6, roughness: 0.9, side: THREE.DoubleSide });
const board = new THREE.MeshStandardMaterial({ color: 0xf2f1ec, roughness: 0.7 });
const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xf4f2ec, roughness: 0.35, metalness: 0.0, side: THREE.DoubleSide });

// one sheet: across x from the gutter to the fore edge, along z the page height.
// It rises out of the gutter to a crest, then falls gently toward the fore edge; upper sheets rise higher and part from each other.
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function sheet(side, i) {
  const t = i / (N - 1);
  const base = 0.045 * i;
  const lift = (2 + 26 * Math.pow(t, 2.2)) * (0.95 + 0.1 * rnd());
  const crest = 14 + 34 * t;                              // where the sheet stops rising
  const fall = 0.25 + 0.25 * (1 - t);                     // how much of the lift is left at the fore edge
  const geo = new THREE.PlaneGeometry(1, D, 120, 1);
  const p = geo.attributes.position;
  for (let k = 0; k < p.count; k++) {
    const u = p.getX(k) + 0.5, x = u * W * (1 - 0.04 * t);
    const r = x < crest ? Math.sin(Math.PI / 2 * x / crest) : 1 - (1 - fall) * Math.pow((x - crest) / (W - crest), 1.3);
    p.setXYZ(k, side * (x + 0.6 * t), base + lift * r, p.getY(k));
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, paper); m.castShadow = m.receiveShadow = true; return m;
}
const book = new THREE.Group();
for (const side of [1, -1]) for (let i = 0; i < N; i++) book.add(sheet(side, i));
for (const side of [1, -1]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(W + 6, 2.6, D + 6), board);
  b.position.set(side * (W / 2 + 2), -1.3, 0); b.castShadow = b.receiveShadow = true; book.add(b);
}
// ribbon: out of the gutter at the near end, over the page edge, down onto the table
{
  const pts = [new THREE.Vector3(0, 3, D / 2 - 30), new THREE.Vector3(0.6, 3.4, D / 2 - 4), new THREE.Vector3(3, 2, D / 2 + 6),
               new THREE.Vector3(9, -1, D / 2 + 18), new THREE.Vector3(16, -3.4, D / 2 + 40), new THREE.Vector3(26, -3.5, D / 2 + 70)];
  const curve = new THREE.CatmullRomCurve3(pts);
  const seg = 160, w = 3.2, pos = [], idx = [];
  for (let s = 0; s <= seg; s++) {
    const c = curve.getPoint(s / seg), tan = curve.getTangent(s / seg);
    const side = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize().multiplyScalar(w / 2);
    pos.push(c.x - side.x, c.y + 0.3, c.z - side.z, c.x + side.x, c.y + 0.3, c.z + side.z);
    if (s < seg) { const a = s * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const r = new THREE.Mesh(g, ribbonMat); r.castShadow = r.receiveShadow = true; book.add(r);
}
book.position.y = 2.6;
book.rotation.y = THREE.MathUtils.degToRad(num('rot', -32));
scene.add(book);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const key = new THREE.DirectionalLight(0xffffff, num('ki', 2.2)); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.2;
Object.assign(key.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 100, far: 3000 });
scene.add(key); scene.add(key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0xeeeeea, num('bounce', 0.6)));

const SOFTBOX = new THREE.Vector3(num('kx', 500), num('ky', 900), num('kz', -300)).normalize();
const PASSES = num('passes', 96), SPREAD = num('spread', 0.8);
function lightDir(i) {
  const a = (i + 0.5) / PASSES, t = i * 2.39996;
  const up = new THREE.Vector3(0, 1, 0), u = new THREE.Vector3().crossVectors(SOFTBOX, up).normalize(), v = new THREE.Vector3().crossVectors(u, SOFTBOX);
  const r = SPREAD * Math.sqrt(a);
  return SOFTBOX.clone().addScaledVector(u, r * Math.cos(t)).addScaledVector(v, r * Math.sin(t)).normalize();
}

const camera = new THREE.PerspectiveCamera(num('fov', 28), OUT_W / OUT_H, 5, 5000);
camera.position.set(num('cx', 150), num('cy', 95), num('cz', 260)); camera.lookAt(num('tx', -40), num('ty', 8), num('tz', 30));
// shift the frame (like a shift lens) so the book sits in the left part and the right stays free for type
camera.setViewOffset(OUT_W, OUT_H, num('sx', 0) * OUT_W, num('sy', 0) * OUT_H, OUT_W, OUT_H);

const passRT = new THREE.WebGLRenderTarget(OUT_W, OUT_H, { type: THREE.HalfFloatType, samples: 4 });
const accRT = new THREE.WebGLRenderTarget(OUT_W, OUT_H, { type: THREE.FloatType });
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quadGeo = new THREE.PlaneGeometry(2, 2);
const addMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: passRT.texture }, k: { value: 1 / PASSES } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform sampler2D t; uniform float k; varying vec2 vUv; void main(){ gl_FragColor = texture2D(t, vUv) * k; }',
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor,
  depthTest: false, depthWrite: false, toneMapped: false,
});
const addScene = new THREE.Scene(); addScene.add(new THREE.Mesh(quadGeo, addMat));
renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000, 0); renderer.clear();
renderer.setClearColor(0xffffff, 1);
for (let i = 0; i < PASSES; i++) {
  key.position.copy(lightDir(i)).multiplyScalar(1400);
  renderer.setRenderTarget(passRT); renderer.clear(); renderer.render(scene, camera);
  renderer.autoClear = false; renderer.setRenderTarget(accRT); renderer.render(addScene, quadCam); renderer.autoClear = true;
  if (i % 8 === 7) await new Promise(r => setTimeout(r, 0));
}
const outMat = new THREE.MeshBasicMaterial({ map: accRT.texture });
outMat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', 'gl_Position = vec4(position.xy, 0.0, 1.0);'); };
const outScene = new THREE.Scene(); outScene.add(new THREE.Mesh(quadGeo, outMat));
renderer.setRenderTarget(null); renderer.clear(); renderer.render(outScene, quadCam);
window.__done = true;
</script>
</body></html>
