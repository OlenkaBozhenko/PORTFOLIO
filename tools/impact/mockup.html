<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My impact mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* mockup of the My impact modal (impact-modal.md); not part of the site */
:root{--ink:#0E0E0E;--muted:#6B6B6B;--page:#F3F3F1}
*{box-sizing:border-box;margin:0}
body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--page);color:var(--ink);padding:40px 24px 80px}
h1{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start}
.tools{margin:0 0 18px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.tools button{font:inherit;color:var(--ink);font-size:14px;padding:10px 18px;border-radius:99px;border:1px solid var(--ink);background:#fff;cursor:pointer}

/* every letter is its own box, stretched to the size the layout gives it */
.lt{position:absolute;inset:0;pointer-events:none}
.lt svg{position:absolute;display:block;overflow:visible}
.lt path{fill:var(--ink);fill-rule:evenodd}

.dlg{position:relative;width:900px;height:540px;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.12);overflow:hidden}
.ph{position:relative;width:375px;height:740px;background:#fff;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.12);overflow:hidden}
.rt{position:absolute;transition:opacity .45s,transform .45s}
.rt.off{opacity:0;transform:translateY(12px)}
.dlg .rt{left:400px;right:56px;top:120px}
.ph .rt{left:16px;right:16px;top:236px}
.ttl{font-size:40px;font-weight:400;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
.ph .ttl{font-size:32px}
.txt{font-size:17px;line-height:1.5;color:var(--muted);max-width:42ch}
.ph .txt{font-size:16px}
.x{position:absolute;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0;transition:opacity .4s}
.x svg{width:100%;height:100%;stroke:var(--ink);stroke-width:1.4;fill:none}
.dlg .x{right:22px;top:22px}
.ph .x{left:50%;bottom:62px;margin-left:-26px;width:52px;height:52px;border-radius:50%;background:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ph .x svg{stroke:#fff;stroke-width:2;width:30px;height:30px;margin:11px}
.dash{position:absolute;display:flex;gap:8px;justify-content:center;transition:opacity .4s}
.dash i{width:30px;height:4px;border-radius:2px;background:#D9D9D5;transition:width .4s,background .4s}
.dash i.on{width:52px;background:var(--ink)}
.dlg .dash{left:400px;bottom:40px}
.ph .dash{left:0;right:0;bottom:38px}
.wait .x,.wait .dash{opacity:0}
</style>
</head>
<body>
<div class="tools"><button type="button" id="play">Play the opening</button><span>Scroll or use the arrow keys over the desktop modal to change slides; swipe on the phone.</span></div>

<div class="row">
<div><h1>Desktop · 900 × 540 · Warmy</h1>
<div class="dlg" id="dlg" tabindex="0">
  <div class="lt"></div>
  <div class="rt"><h2 class="ttl"></h2><p class="txt"></p></div>
  <div class="dash" aria-hidden="true"></div>
  <button class="x" type="button" aria-label="Close"><svg viewBox="0 0 44 44"><path d="M12 12l20 20M32 12L12 32"/></svg></button>
</div></div>

<div><h1>Phone · 375 · Warmy</h1>
<div class="ph" id="ph">
  <div class="lt"></div>
  <div class="rt"><h2 class="ttl"></h2><p class="txt"></p></div>
  <button class="x" type="button" aria-label="Close"><svg viewBox="0 0 44 44"><path d="M12 12l20 20M32 12L12 32"/></svg></button>
  <div class="dash" aria-hidden="true"></div>
</div></div>
</div>

<script>
/* glyphs: 100 units tall, flat tops and bottoms, small rounded corners (r 16) and narrow counters, in the manner of the OB logo */
var G={
 M:[100,'M0,100V0H34L50,38L66,0H100V100H70V52L50,86L30,52V100Z'],
 Y:[92,'M0,0H33L46,36L59,0H92L63,58V100H29V58Z'],
 I:[34,'M0,0H34V100H0Z'],
 P:[82,'M0,0H66A16,16 0 0 1 82,16V50A16,16 0 0 1 66,66H34V100H0Z M50,18A8,8 0 0 1 58,26V40A8,8 0 0 1 50,48A8,8 0 0 1 42,40V26A8,8 0 0 1 50,18Z'],
 A:[84,'M0,100V16A16,16 0 0 1 16,0H68A16,16 0 0 1 84,16V100H52V74H32V100Z M42,22A8,8 0 0 1 50,30V46A8,8 0 0 1 42,54A8,8 0 0 1 34,46V30A8,8 0 0 1 42,22Z'],
 C:[84,'M16,0H68A16,16 0 0 1 84,16V40H52V30A8,8 0 0 0 36,30V70A8,8 0 0 0 52,70V60H84V84A16,16 0 0 1 68,100H16A16,16 0 0 1 0,84V16A16,16 0 0 1 16,0Z'],
 T:[86,'M0,0H86V34H60V100H26V34H0Z']
};
var WORD='MYIMPACT'.split('');
var SLIDES=[
 ['AI email optimization, shipped as an MVP','The business wanted far more than engineering could build in time. I interviewed users to find what mattered most, and we agreed on an MVP that worked for users, the business and engineering.'],
 ['Charts people actually understand','Feedback showed that good-looking charts did not mean users followed the logic behind them. I rebuilt the dashboards around the metrics users rely on.'],
 ['20% more sales time for buyers','Many booked sales calls turned out to be support questions. I redesigned the booking form: it shows what the call will cover and lets people switch to the right consultant. Sales got 20% more time for customers ready to buy.'],
 ['Several audiences, not one','A customer journey map and an audit of product analytics showed that Warmy serves several distinct groups, each relying on different features. Every team got a clear picture of how to work with each group.']
];
/* per slide, how wide each letter is against the others: the word breathes as the slides change */
var BREATH=[[1,1,1,1,1,1,1,1],[1.5,.7,.6,1.4,1.3,.8,.8,1.2],[.7,1.5,1.4,.6,.8,1.3,1.2,.8],[1.2,.9,1,1,.7,1,1.5,.9]];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

/* rows of letter indices laid out in a box; each row fills the box width */
function rows(R,box,wt,gx,gy){
  var out=[],rh=(box.h-gy*(R.length-1))/R.length;
  R.forEach(function(r,ri){
    var sum=0;r.forEach(function(i){sum+=G[WORD[i]][0]*wt[i]});
    var k=(box.w-gx*(r.length-1))/sum,x=box.x;
    r.forEach(function(i){var w=G[WORD[i]][0]*wt[i]*k;out[i]={x:x,y:box.y+ri*(rh+gy),w:w,h:rh};x+=w+gx});
  });
  return out;
}
function risen(L){return L.map(function(r){return {x:r.x,y:r.y+r.h,w:r.w,h:0}})}

function Modal(el,cfg){
  var lt=el.querySelector('.lt'),ttl=el.querySelector('.ttl'),txt=el.querySelector('.txt'),rt=el.querySelector('.rt'),dash=el.querySelector('.dash');
  var svgs=WORD.map(function(c){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 '+G[c][0]+' 100');s.setAttribute('preserveAspectRatio','none');s.setAttribute('aria-hidden','true');var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',G[c][1]);s.appendChild(p);lt.appendChild(s);return s});
  SLIDES.forEach(function(){dash.appendChild(document.createElement('i'))});
  var cur=null,run=0,slide=0;
  function put(L){L.forEach(function(r,i){var s=svgs[i].style;s.left=r.x+'px';s.top=r.y+'px';s.width=Math.max(r.w,0)+'px';s.height=Math.max(r.h,0)+'px'});cur=L}
  /* move every letter from where it is to L; stagger delays letters one after another */
  function to(L,ms,stag){var from=cur,id=run,t0=performance.now(),n=L.length,tot=ms+stag*(n-1);
    return new Promise(function(done){if(reduce||!from){put(L);return done()}
      (function f(now){if(id!==run)return;var o=[];for(var i=0;i<n;i++){var t=Math.min(Math.max((now-t0-i*stag)/ms,0),1),e=ease(t),a=from[i],b=L[i];o.push({x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,w:a.w+(b.w-a.w)*e,h:a.h+(b.h-a.h)*e})}put(o);if(now-t0<tot)requestAnimationFrame(f);else done()})(t0)})}
  function show(k){slide=k;ttl.textContent=SLIDES[k][0];txt.textContent=SLIDES[k][1];[].forEach.call(dash.children,function(d,i){d.classList.toggle('on',i===k)})}
  function settle(k){return rows(cfg.endRows,cfg.end(),BREATH[k],cfg.gx,cfg.gy)}
  this.play=function(){run++;el.classList.add('wait');rt.classList.add('off');show(0);
    var full=cfg.full(),one=[[0,1,2,3,4,5,6,7]],flat=[1,1,1,1,1,1,1,1];
    if(reduce){put(settle(0));el.classList.remove('wait');rt.classList.remove('off');return}
    var a=rows(one,full,flat,cfg.gx,cfg.gy);cur=null;put(risen(a));var id=run;
    /* 1 the letters rise one by one; 2 and 3 their widths swap; 4 they break into rows; 5 they settle into the panel */
    to(a,520,70)
    .then(function(){return id===run&&to(rows(one,full,[2.6,.5,.4,.6,1.8,.5,.5,.6],cfg.gx,cfg.gy),620,0)})
    .then(function(){return id===run&&to(rows(one,full,[.5,.6,.5,2.2,.5,.6,2.4,.5],cfg.gx,cfg.gy),620,0)})
    .then(function(){return id===run&&to(rows(cfg.midRows,full,flat,cfg.gx,cfg.gy),700,35)})
    .then(function(){return id===run&&to(settle(0),900,45)})
    .then(function(){if(id!==run)return;el.classList.remove('wait');rt.classList.remove('off')});
  };
  var busy=false;
  this.go=function(d){var k=slide+d;if(busy||k<0||k>=SLIDES.length||el.classList.contains('wait'))return;busy=true;rt.classList.add('off');
    setTimeout(function(){show(k);rt.classList.remove('off')},260);
    to(settle(k),700,30).then(function(){busy=false})};
}

var D=new Modal(document.getElementById('dlg'),{gx:6,gy:6,
  full:function(){return {x:28,y:28,w:844,h:484}},end:function(){return {x:28,y:28,w:330,h:484}},
  midRows:[[0,1],[2,3,4,5,6,7]],endRows:[[0,1],[2,3],[4,5,6,7]]});
var P=new Modal(document.getElementById('ph'),{gx:5,gy:5,
  full:function(){return {x:16,y:20,w:343,h:600}},end:function(){return {x:16,y:20,w:343,h:190}},
  midRows:[[0,1],[2,3],[4,5,6,7]],endRows:[[0,1],[2,3,4,5,6,7]]});

function playAll(){D.play();P.play()}
document.getElementById('play').addEventListener('click',playAll);
playAll();

var dlg=document.getElementById('dlg'),wl=0;
dlg.addEventListener('wheel',function(e){e.preventDefault();var n=Date.now();if(n-wl<750||Math.abs(e.deltaY)<8)return;wl=n;D.go(e.deltaY>0?1:-1)},{passive:false});
dlg.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();D.go(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();D.go(-1)}});
var ph=document.getElementById('ph'),sx=0,sy=0;
ph.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
ph.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))P.go(dx<0?1:-1);else if(Math.abs(dy)>40)P.go(dy<0?1:-1)});
ph.addEventListener('wheel',function(e){e.preventDefault();var n=Date.now();if(n-wl<750||Math.abs(e.deltaY)<8)return;wl=n;P.go(e.deltaY>0?1:-1)},{passive:false});
</script>
</body>
</html>
